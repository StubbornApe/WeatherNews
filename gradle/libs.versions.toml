[versions]
agp = "8.7.3"
coreKtx = "1.13.1"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
appcompat = "1.7.0"
material = "1.12.0"
activityKtx = "1.9.3"
constraintlayout = "2.1.4"
kotlin = "2.0.21"
navigation = "2.8.5"
retrofit = "2.11.0"
okhttp   = "4.12.0"
room = "2.6.1"
ksp  = "2.0.21-1.0.28"
datastore = "1.1.1"
lifecycle = "2.8.7"        # ⭐ Day 11 新增
fragmentKtx = "1.8.5"      # ⭐ Day 11 新增
coil = "2.7.0"             # ⭐ Day 13 挑战 3 新增
hilt = "2.52"              # ⭐ Day 14 新增
swiperefreshlayout = "1.1.0"   # ⭐ Day 15 挑战 4 新增:下拉刷新
mockk = "1.13.13"             # ⭐ Day 16 新增:MockK 单元测试框架
jacoco = "0.8.12"             # ⭐ Day 17 新增:JaCoCo 覆盖率统计
# ⭐ Day 18 新增:UI 测试(Espresso + Hilt 测试)
espressoContrib = "3.6.1"
runner = "1.6.2"
rules = "1.6.1"
core = "1.6.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activityKtx" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-navigation-fragment-ktx = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "navigation" }
androidx-navigation-ui-ktx       = { group = "androidx.navigation", name = "navigation-ui-ktx",       version.ref = "navigation" }
retrofit-core             = { group = "com.squareup.retrofit2", name = "retrofit",              version.ref = "retrofit" }
retrofit-converter-gson   = { group = "com.squareup.retrofit2", name = "converter-gson",        version.ref = "retrofit" }
okhttp-core               = { group = "com.squareup.okhttp3",    name = "okhttp",                version.ref = "okhttp"   }
okhttp-logging-interceptor = { group = "com.squareup.okhttp3",   name = "logging-interceptor",   version.ref = "okhttp"   }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx",  name = "kotlinx-coroutines-android", version = "1.9.0" }
room-runtime     = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx         = { group = "androidx.room", name = "room-ktx",     version.ref = "room" }
room-compiler    = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# ⭐ Day 11 新增:ViewModel / repeatOnLifecycle / by viewModels()
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-ktx   = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx",   version.ref = "lifecycle" }
androidx-fragment-ktx            = { group = "androidx.fragment",    name = "fragment-ktx",            version.ref = "fragmentKtx" }
coil                             = { group = "io.coil-kt",           name = "coil",                    version.ref = "coil"      }

# ⭐ Day 14 新增：Hilt 依赖注入
hilt-android  = { group = "com.google.dagger", name = "hilt-android",           version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler",  version.ref = "hilt" }

# ⭐ Day 15 挑战 4 新增:下拉刷新组件
androidx-swiperefreshlayout = { group = "androidx.swiperefreshlayout", name = "swiperefreshlayout", version.ref = "swiperefreshlayout" }

# ⭐ Day 16 新增:单测框架
mockk                      = { group = "io.mockk", name = "mockk",                          version.ref = "mockk" }
kotlinx-coroutines-test    = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version = "1.9.0" }

# ⭐ Day 18 新增:UI 测试依赖
androidx-espresso-contrib = { group = "androidx.test.espresso", name = "espresso-contrib", version.ref = "espressoContrib" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "core" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "runner" }
androidx-test-rules = { group = "androidx.test", name = "rules", version.ref = "rules" }
hilt-android-testing = { group = "com.google.dagger", name = "hilt-android-testing", version.ref = "hilt" }


[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }    # ⭐ Day 14 新增
